    <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1 1 0 0 0 .2 1.1l.1.1-2 2-.1-.1a1 1 0 0 0-1.1-.2l-1.1.5a1 1 0 0 0-.6.9V20h-2.8v-.2a1 1 0 0 0-.6-.9l-1.1-.5a1 1 0 0 0-1.1.2l-.1.1-2-2 .1-.1a1 1 0 0 0 .2-1.1l-.5-1.1a1 1 0 0 0-.9-.6H5v-2.8h.2a1 1 0 0 0 .9-.6l.5-1.1a1 1 0 0 0-.2-1.1l-.1-.1 2-2 .1.1a1 1 0 0 0 1.1.2l1.1-.5a1 1 0 0 0 .6-.9V4h2.8v.2a1 1 0 0 0 .6.9l1.1.5a1 1 0 0 0 1.1-.2l.1-.1 2 2-.1.1a1 1 0 0 0-.2 1.1l.5 1.1a1 1 0 0 0 .9.6h.2v2.8h-.2a1 1 0 0 0-.9.6l-.5 1.1Z"/></symbol>
    <symbol id="i-camera" viewBox="0 0 24 24"><rect x="2" y="5" width="15" height="14" rx="3"/><path d="m17 10 5-3v10l-5-3"/></symbol>
    <symbol id="i-eyeoff" viewBox="0 0 24 24"><path d="M3 3 21 21M10.6 5.2A11.7 11.7 0 0 1 12 5c5.5 0 9 7 9 7a17 17 0 0 1-3.1 3.9M6.6 6.7A17 17 0 0 0 3 12s3.5 7 9 7a10 10 0 0 0 4.2-.9M10 10a3 3 0 0 0 4 4"/></symbol>
    <symbol id="i-robot" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="15" rx="5"/><path d="M12 6V3M8 13h.01M16 13h.01M8 17c2.4 1.5 5.6 1.5 8 0"/></symbol>
    <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5m-4 0h8"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 2 4 5v6c0 5.3 3.2 9.1 8 11 4.8-1.9 8-5.7 8-11V5l-8-3Z"/><path d="m9 12 2 2 4-4"/></symbol>
    <symbol id="i-bulb" viewBox="0 0 24 24"><path d="M9 18h6m-5 3h4m-2-19a7 7 0 0 0-4 12.8c.7.5 1 1.2 1 2.2h6c0-1 .3-1.7 1-2.2A7 7 0 0 0 12 2Z"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 11v6m0-10h.01"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></symbol>

  <div class="stage"><div class="showcase">
    <aside class="stage-copy"><div class="stage-mark"><svg class="icon lg" fill="none" stroke="currentColor" stroke-width="1.8"><use href="#i-grid"/></svg></div><div class="eyebrow" style="margin-top:24px">PRODUCT CONCEPT · INTERACTIVE DEMO</div><h1>집의 모든 공간이<br>하나로 이해하다.</h1><p>방마다 놓인 모듈이 가족의 움직임을 이어 보고, 일상의 순간에 맞춰 집이 조용히 반응합니다.</p><div class="note"><strong>HomeMesh 모바일 앱 데모</strong><br>가족 등록부터 실시간 집 지도, 프라이버시 모드, 행동 이유까지 직접 눌러 볼 수 있습니다. 영상·음성 인식과 가전 제어는 시나리오로 모사합니다.</div><div class="desktop-tip"><svg class="icon sm" fill="none" stroke="currentColor" stroke-width="1.8"><use href="#i-info"/></svg>브라우저 개발자 도구에서 모바일 화면으로도 볼 수 있습니다.</div></aside>
    <main class="phone" aria-label="HomeMesh 모바일 앱 데모"><div class="phone-inner" id="app"></div><div class="toast" id="toast" role="status" aria-live="polite"></div><div id="overlay"></div></main>
  </div></div>
  <script>
  (()=>{
    'use strict';
    const STORAGE='homemesh-demo-v1';
    const roomIds=['bedroom','extra','living','kitchen'];
    const defaultRooms={bedroom:'방 1',extra:'방 2',living:'거실',kitchen:'주방'};
    const defaultModules=[{id:'HM-101',room:'bedroom',on:true},{id:'HM-102',room:'living',on:true},{id:'HM-103',room:'kitchen',on:true}];
    const defaultPeople=[{id:'p1',name:'민호',color:'blue',face:false,voice:false,wake:['06:00','07:00'],sleep:['23:00','00:30'],weekendWake:['08:00','09:30'],temp:23,nightLight:12},{id:'p2',name:'지수',color:'peach',face:false,voice:false,wake:['07:00','08:00'],sleep:['23:30','01:00'],weekendWake:['09:00','10:00'],temp:24,nightLight:18}];
    const scenarioSteps=[
      {title:'조용한 저녁',desc:'민호는 방 1, 지수는 거실에서 TV를 보고 있습니다.',event:'집의 현재 상황을 확인했어요',detail:'두 사람의 위치와 활동을 방별로 표시합니다.'},
      {title:'민호가 방을 나왔어요',desc:'방 1에서 마지막으로 관측되어 이동 중으로 표시합니다.',event:'민호 · 이동 중',detail:'방 1에서 사라졌지만 아직 거실에 있다고 단정하지 않았어요.'},
      {title:'거실에서 다시 확인',desc:'거실 모듈이 민호를 확인해 위치를 이어 받았습니다.',event:'방 사이 인계 완료',detail:'민호의 위치를 방 1에서 거실로 갱신했어요.'},
      {title:'가족의 상황이 달라요',desc:'민호는 쉬려 하고, 지수는 TV를 보고 있어요.',event:'TV 조절을 보류했어요',detail:'민호의 휴식을 위해 조명만 낮추고, 지수의 TV는 유지했어요.'},
      {title:'거실 프라이버시 모드',desc:'거실 카메라를 끄면 현재 위치를 확정하지 않습니다.',event:'거실 관측을 중지했어요',detail:'마지막 위치는 남지만 현재 위치는 미확인으로 바뀝니다.'},
      {title:'주방에서 다시 발견',desc:'주방 모듈이 민호를 확인해 공동 상태가 갱신됩니다.',event:'민호 · 주방에서 확인',detail:'거실 관측이 꺼진 상태에서도 다른 공간에서 다시 확인했어요.'}
    ];
    const initial=()=>({onboard:0,scan:'robot',homeName:'우리 집',rooms:{...defaultRooms},modules:structuredClone(defaultModules),people:structuredClone(defaultPeople),enrollPerson:'p1',enrollMode:'face',weekday:'weekday',tab:'home',scenario:0,routines:{night:true,rest:true,clean:true,arrival:false},privacy:{bedroom:false,extra:false,living:false,kitchen:false},showValues:false,logs:[]});
    let state;
    try{state={...initial(),...JSON.parse(localStorage.getItem(STORAGE)||'{}')}}catch{state=initial()}
    if(!state.rooms||!state.modules||!state.people)state=initial();
    if(new URLSearchParams(location.search).get('demo')==='1'){state.people.forEach(p=>{p.face=true;p.voice=true});state.onboard=7}
    let sheet=null;let toastTimer;
    const $=id=>document.getElementById(id);
    const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const icon=(name,cl='')=>`<svg class="icon ${cl}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-${name}"/></svg>`;
    const save=()=>{try{localStorage.setItem(STORAGE,JSON.stringify(state))}catch{}};
    const now=()=>new Intl.DateTimeFormat('ko-KR',{hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date());
    const log=(title,description)=>{state.logs=[{title,description,time:now()},...(state.logs||[])].slice(0,12)};
    const say=message=>{const el=$('toast');el.textContent=message;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2600)};
    const avatar=(person,size='')=>`<span class="avatar ${person.color==='peach'?'peach':person.color==='green'?'green':''} ${size}">${esc(person.name.slice(0,1))}</span>`;
    const statusbar=()=>`<div class="statusbar"><span>9:41</span><span class="status-icons"><span class="signal"><i></i><i></i><i></i></span><span style="font-size:10px">●</span><span class="battery"></span></span></div>`;
    const progress=(step,label)=>`<div class="progress"><div class="progress-meta"><span>${label}</span><span>${step} / 5</span></div><div class="progress-line"><i style="width:${step*20}%"></i></div></div>`;
    const footer=(next='계속',back=true)=>`<div class="onboard-actions">${back?`<button class="secondary" data-action="back">이전</button>`:''}<button class="primary" data-action="next">${next}</button></div>`;
    const head=(title,desc)=>`<div class="onboard-head"><div class="eyebrow">처음 시작하기</div><h1>${title}</h1><p>${desc}</p></div>`;
    const livePerson=(room)=>{
      const p1=state.people[0],p2=state.people[1],s=state.scenario;
      if(room==='bedroom')return s<1?[{person:p1,label:s===0?'휴식 중':'확인됨'}]:[];
      if(room==='living')return s===2||s===3?[{person:p1,label:s===3?'쉬는 중':'확인됨'},{person:p2,label:'TV 시청'}]:s===4?[{person:p1,label:'마지막 확인',unknown:true},{person:p2,label:'마지막 확인',unknown:true}]:s===5?[{person:p2,label:'마지막 확인',unknown:true}]:[{person:p2,label:'TV 시청'}];
      if(room==='kitchen')return s===5?[{person:p1,label:'확인됨'}]:[];
      return [];
    };
    const miniMap=(test='')=>`<div class="mini-map" aria-label="집 구조 미리보기">${roomIds.map(id=>`<div>${esc(state.rooms[id])}${test===id?'<br><span style="color:#325de8;font-size:10px">● 위치 확인</span>':''}</div>`).join('')}</div>`;
    function onboard(){
      const s=state.onboard;
      if(s===0)return `${statusbar()}<div class="topbar"><div class="brand"><span class="brand-icon">${icon('grid','sm')}</span>HomeMesh</div><span class="pill">앱 콘셉트</span></div><div class="onboard-head" style="padding-top:54px"><div class="eyebrow">A HOME THAT UNDERSTANDS</div><h1>우리 집의 공간을<br>함께 연결해요.</h1><p>가족이 어디에서 무엇을 하는지 이해하고, 필요한 순간에 집이 조용히 반응합니다.</p></div><div class="onboard-content"><div class="card card-pad" style="background:linear-gradient(130deg,#e9efff,#effaf6);border:0;margin:15px 0 23px"><div style="font-size:55px;text-align:center;line-height:1.9">⌂ <span style="font-size:30px">● · ●</span></div><div class="small bold">설정은 약 3분</div><div class="small muted">집 구조, 모듈, 가족, 생활 선호를 차례로 등록합니다.</div></div><div class="notice">이 화면은 제품 경험을 보여주는 데모입니다. 인식과 가전 제어는 모사합니다.</div></div><div class="onboard-actions"><button class="primary" data-action="next">우리 집 설정하기</button></div><div class="pad"><button class="link-btn" data-action="sample">예시 집으로 빠르게 체험하기 →</button></div>`;
      if(s===1)return `${statusbar()}${progress(1,'집 구조 만들기')}${head('집의 모습을 알려주세요','공간을 연결하는 세 가지 방법 중 하나를 선택하세요. 나중에 변경할 수 있습니다.')}<div class="onboard-content"><div class="field"><label for="homeName">집 이름</label><input id="homeName" data-field="homeName" maxlength="20" value="${esc(state.homeName)}"></div>${[['robot','robot','로봇청소기 지도 가져오기','기존 청소 지도를 바탕으로 방을 만듭니다.'],['lidar','grid','iPhone으로 공간 스캔','LiDAR 지원 기기에서 방 구조를 스캔합니다.'],['manual','home','스캔 없이 직접 만들기','방 이름과 배치만으로 바로 시작합니다.']].map(([id,ic,title,desc])=>`<button class="option ${state.scan===id?'selected':''}" data-action="scan" data-value="${id}"><span class="option-icon">${icon(ic)}</span><span class="grow"><strong>${title}</strong><small>${desc}</small></span><span class="check"></span></button>`).join('')}<div class="notice">시연에서는 실제 기기 스캔 없이 예시 평면도를 불러옵니다.</div></div>${footer()}`;
      if(s===2)return `${statusbar()}${progress(2,'집 구조 확인')}${head('방을 확인해 주세요','집 구조에서 방 이름을 바꿀 수 있습니다. 모듈은 다음 단계에서 배치합니다.')}<div class="onboard-content"><div class="card card-pad"><div class="small bold">${esc(state.homeName)} · 예시 평면도</div>${miniMap()}${roomIds.map(id=>`<div class="field" style="margin-bottom:9px"><label for="room-${id}">${esc(defaultRooms[id])} 이름</label><input id="room-${id}" data-room-name="${id}" maxlength="12" value="${esc(state.rooms[id])}"></div>`).join('')}</div><div class="notice" style="margin-top:12px">실제 제품에서는 지도에서 방 경계와 출입구도 수정할 수 있습니다. 이 데모는 방 이름 변경을 제공합니다.</div></div>${footer()}`;
      if(s===3)return `${statusbar()}${progress(3,'모듈 연결과 배치')}${head('각 방에 모듈을 배치해요','발견된 모듈을 선택하고 집 지도에서 맡을 방을 지정하세요.')}<div class="onboard-content"><div class="notice">출입구와 주 사용 공간이 넓게 보이는 곳에 설치하세요. 가구에 가리지 않도록 높이를 조절하고, 사생활이 필요한 영역은 제외하세요.</div><div class="section-head"><h2>주변에서 발견한 모듈</h2><small>${state.modules.length}개 선택됨</small></div><div class="card card-pad">${[1,2,3,4].map(i=>{const id=`HM-10${i}`,m=state.modules.find(x=>x.id===id);return `<div class="select-room"><button class="chip ${m?'active':''}" data-action="pair-module" data-value="${id}" aria-pressed="${!!m}">${m?'✓ 연결됨':'○ 연결'}</button><span style="flex:1">모듈 ${i} <span class="tiny muted">${id}</span></span>${m?`<select aria-label="모듈 ${i} 방 선택" data-module="${id}">${roomIds.map(room=>`<option value="${room}" ${m.room===room?'selected':''}>${esc(state.rooms[room])}</option>`).join('')}</select>`:''}</div>`}).join('')}</div><div style="margin-top:12px">${miniMap()}</div><div class="tiny muted">연결된 모듈은 나중에 설정에서 끄거나 다시 켤 수 있습니다.</div></div>${footer()}`;
      if(s===4){const person=state.people.find(p=>p.id===state.enrollPerson)||state.people[0],face=state.enrollMode==='face',done=face?person.face:person.voice;return `${statusbar()}${progress(4,'가족 등록')}${head('가족을 알아보게 해주세요','얼굴과 목소리를 각각 시험한 뒤 함께 사용합니다.')}<div class="onboard-content"><div class="chip-row" style="margin-bottom:12px">${state.people.map(p=>`<button class="chip ${p.id===person.id?'active':''}" data-action="enroll-person" data-value="${p.id}">${esc(p.name)} ${p.face&&p.voice?'✓':''}</button>`).join('')}<button class="chip" data-action="add-person">+ 가족 추가</button></div><div class="face-voice-tabs"><button class="${face?'active':''}" data-action="enroll-mode" data-value="face">① 얼굴 시험 ${person.face?'✓':''}</button><button class="${!face?'active':''}" data-action="enroll-mode" data-value="voice">② 목소리 시험 ${person.voice?'✓':''}</button></div>${face?`<div class="camera-preview"><span>모듈 카메라 · 얼굴 인식 시뮬레이션</span></div>`:`<div class="voice-preview"><div class="wave">${'<i></i>'.repeat(11)}</div><div style="font-size:10px;opacity:.8">“안녕, HomeMesh” · 음성 시험 시뮬레이션</div></div>`}<div class="card card-pad"><div class="small bold">${face?'얼굴':'목소리'} 시험</div><p class="small muted" style="margin:5px 0 12px">${face?'모듈이 얼굴을 확인하면 시험 위치를 집 지도에 표시합니다.':'목소리를 확인하면 시험 위치를 집 지도에 표시합니다.'}</p><button class="primary" style="width:100%" data-action="test-enroll">${done?'다시 시험하기':'인식 시험 시작'}</button>${done?`<div class="test-result">✓ ${esc(person.name)} 확인 완료 · ${esc(state.rooms[face?'living':'kitchen'])}에서 확인</div>${miniMap(face?'living':'kitchen')}`:''}</div><div class="notice" style="margin-top:12px">${icon('shield','sm')} 얼굴 영상과 음성 원본은 해당 모듈의 격리된 로컬 환경에서 처리하도록 설계합니다. 공유 상태에는 인식 결과와 필요한 위치 정보만 전달합니다.</div>${person.face&&person.voice?`<div class="notice good" style="margin-top:9px">두 시험 통과 · 실제 서비스에서는 얼굴과 목소리를 함께 고려합니다. 결과가 엇갈리면 확인을 요청합니다.</div>`:''}</div>${footer('생활 설정으로',true)}`}
      if(s===5){const p=state.people.find(x=>x.id===state.enrollPerson)||state.people[0];return `${statusbar()}${progress(5,'생활 선호')}${head('생활 리듬을 알려주세요','정확한 시각 대신 대략적인 범위를 지정할 수 있습니다.')}<div class="onboard-content"><div class="chip-row" style="margin-bottom:12px">${state.people.map(x=>`<button class="chip ${x.id===p.id?'active':''}" data-action="enroll-person" data-value="${x.id}">${esc(x.name)}</button>`).join('')}</div><div class="weekday-row">${['월','화','수','목','금','토','일'].map((d,i)=>`<button class="${i<5&&state.weekday==='weekday'||i>=5&&state.weekday==='weekend'?'active':''}" data-action="weekday" data-value="${i<5?'weekday':'weekend'}">${d}</button>`).join('')}</div><div class="card card-pad"><div class="field"><label>대략적인 기상 시간 · ${state.weekday==='weekday'?'평일':'주말'}</label><div class="range-pair"><input type="time" data-pref="${state.weekday==='weekday'?'wake0':'weekendWake0'}" value="${state.weekday==='weekday'?p.wake[0]:p.weekendWake[0]}"><span>부터</span><input type="time" data-pref="${state.weekday==='weekday'?'wake1':'weekendWake1'}" value="${state.weekday==='weekday'?p.wake[1]:p.weekendWake[1]}"></div></div><div class="field"><label>대략적인 취침 시간</label><div class="range-pair"><input type="time" data-pref="sleep0" value="${p.sleep[0]}"><span>부터</span><input type="time" data-pref="sleep1" value="${p.sleep[1]}"></div></div><div class="field"><label for="temp">선호 온도 · ${p.temp}°C</label><input id="temp" type="range" min="18" max="28" data-pref="temp" value="${p.temp}"></div><div class="field" style="margin-bottom:0"><label for="nightLight">야간 이동 조명 · ${p.nightLight}%</label><input id="nightLight" type="range" min="5" max="50" step="1" data-pref="nightLight" value="${p.nightLight}"></div></div><div class="notice" style="margin-top:12px">이 값은 언제든 바꿀 수 있습니다. 자동화는 각 가족의 선호와 현재 상황을 함께 고려합니다.</div></div>${footer('설정 완료',true)}`}
      return `${statusbar()}<div class="onboard-head" style="padding-top:68px"><div style="width:58px;height:58px;border-radius:19px;background:#dff8ec;color:#16815b;display:grid;place-items:center;font-size:26px">✓</div><h1>우리 집 준비가<br>끝났어요.</h1><p>방마다 모듈이 관측한 상황을 하나의 집 지도에서 확인해 보세요.</p></div><div class="onboard-content"><div class="card card-pad"><div class="small bold">${esc(state.homeName)} 준비 상태</div>${miniMap()}<div class="pill-row"><span class="pill">${state.modules.length}개 모듈</span><span class="pill">${state.people.length}명 가족</span><span class="pill">4개 방</span></div></div><div class="notice" style="margin-top:12px">이 데모의 카메라·음성 인식과 가전 제어는 시나리오 모사입니다.</div></div><div class="onboard-actions"><button class="primary" data-action="finish">집 현황 보기</button></div>`;

    function floor(){const env={bedroom:'22°C · 46%',extra:'센서 없음',living:'23°C · 48%',kitchen:'24°C · 52%'};return `<div class="card map-card"><div class="map-toolbar"><span class="map-title">${icon('home','sm')} ${esc(state.homeName)} 평면도</span><span class="live-mark"><span class="dot"></span> 실시간 예시</span></div><div class="floor">${roomIds.map(id=>{const privacy=state.privacy[id],ppl=livePerson(id).map(x=>privacy?{...x,unknown:true,label:'마지막 확인'}:x),module=state.modules.find(m=>m.room===id&&m.on);return `<button class="room ${id} ${privacy?'privacy':''}" data-action="room" data-value="${id}" aria-label="${esc(state.rooms[id])} 상세 보기"><span class="room-name">${esc(state.rooms[id])}</span><span class="room-env">${env[id]}</span><span class="camera-glyph">${privacy?icon('eyeoff','sm'):module?icon('camera','sm'):''}</span>${ppl.length?`<span class="room-person ${ppl.some(p=>p.unknown)?'unknown':''}">${ppl.map(x=>`${avatar(x.person)} ${esc(x.person.name)}`).join(' · ')}${ppl.some(p=>p.unknown)?' ?':''}</span>`:`<span class="room-person ${state.scenario===1&&id==='bedroom'||privacy?'unknown':''}">${state.scenario===1&&id==='bedroom'?'이동 중':privacy?'관측 중지':'비어 있음'}</span>`}</button>`}).join('')}</div><div class="map-foot"><span>${icon('shield','sm')} 원본 영상·음성 공유 없음</span><button class="link-btn" data-action="map-info">상태 표시 안내</button></div></div>`}
    function home(){const sc=scenarioSteps[state.scenario],active=state.modules.filter(m=>m.on).length;return `${statusbar()}<div class="topbar"><div class="brand"><span class="brand-icon">${icon('grid','sm')}</span>HomeMesh</div><button class="round-btn" data-action="go-settings" aria-label="설정 열기">${icon('settings','sm')}</button></div><div class="hero"><div class="hello">좋은 저녁이에요</div><h1>집이 가족의 오늘에<br>맞춰 움직이고 있어요.</h1><div class="hero-sub">각 공간의 정보를 연결해 현재 상황을 보여줍니다.</div><div class="pill-row"><span class="pill"><span class="dot"></span> 모듈 ${active}/${state.modules.length} 작동</span><span class="pill"><span class="dot ${state.scenario===4?'amber':''}"></span> ${state.scenario===4?'일부 관측 중지':'집 상태 정상'}</span></div></div><div class="pad">${floor()}<div class="section-head"><h2>지금 집에서</h2><button class="link-btn" data-action="logs">전체 기록</button></div><div class="card event-card"><span class="event-icon">${icon(state.scenario===4?'eyeoff':'spark','sm')}</span><div class="event-body"><strong>${sc.event}</strong><p>${sc.detail}</p><div class="event-actions"><button class="link-btn" data-action="why">왜 이렇게 했나요?</button><button class="link-btn" data-action="undo">되돌리기</button></div></div></div><div class="section-head"><h2>하루 속 HomeMesh</h2><small>눌러서 변화 보기</small></div><div class="scenario"><div class="scenario-top">INTERACTIVE STORY · ${state.scenario+1}/6</div><h3>${sc.title}</h3><p>${sc.desc}</p><div class="scenario-controls"><div class="dots">${scenarioSteps.map((_,i)=>`<i class="${i===state.scenario?'active':''}"></i>`).join('')}</div><button class="white-btn" data-action="scenario-next">${state.scenario===5?'처음부터':'다음 장면 →'}</button></div></div><div class="spacer"></div></div>${tabs()}`}
    function peoplePage(){const p=state.people[0];return `${statusbar()}${pageHead('생활 패턴','가족마다 다른 하루를 기억해요.','FAMILY & RHYTHM')}<div class="pad"><div class="stack">${state.people.map(p=>`<button class="person-card" data-action="person-detail" data-value="${p.id}">${avatar(p)}<span class="detail"><strong>${esc(p.name)}</strong><small>${p.face&&p.voice?'얼굴·목소리 등록됨':'예시 사용자'} · 선호 ${p.temp}°C</small></span><span class="chev">›</span></button>`).join('')}</div><div class="section-head"><h2>24시간 활동 흐름</h2><small>예시 데이터</small></div><div class="card schedule"><div class="schedule-title"><span>${esc(p.name)}의 하루</span><button class="link-btn" data-action="person-detail" data-value="${p.id}">설정 수정</button></div><div class="timeline-hours"><span>00</span><span>04</span><span>08</span><span>12</span><span>16</span><span>20</span><span>24</span></div><div class="timeline"><span style="width:25%;background:#665abf"></span><span style="width:5%;background:#90aff9"></span><span style="width:8%;background:#b8d2f5"></span><span style="width:25%;background:#e8ebf1"></span><span style="width:30%;background:#73c6b0"></span><span style="width:7%;background:#665abf"></span></div><div class="legend"><span><i style="background:#665abf"></i>수면</span><span><i style="background:#90aff9"></i>기상</span><span><i style="background:#e8ebf1"></i>외출</span><span><i style="background:#73c6b0"></i>집에서 활동</span></div><p class="tiny muted" style="margin:12px 0 0">실선은 직접 설정한 범위, 활동 막대는 시연용 관측 예시입니다.</p></div><div class="section-head"><h2>현재 선호</h2></div><div class="pref-grid"><div class="pref-box"><small>평일 기상 범위</small><strong>${esc(p.wake.join('–'))}</strong></div><div class="pref-box"><small>취침 범위</small><strong>${esc(p.sleep.join('–'))}</strong></div><div class="pref-box"><small>선호 온도</small><strong>${p.temp}°C</strong></div><div class="pref-box"><small>야간 조명</small><strong>${p.nightLight}%</strong></div></div><div class="notice" style="margin-top:12px">현재 위치, 추정한 활동, 직접 설정한 선호는 서로 다른 정보입니다. 추정이 틀리면     function routinesPage(){const cards=[['night','bulb','밤중 이동 조명','기상 직후 이동할 공간을 눈부시지 않게 준비합니다.','민호 · 야간 밝기 '+state.people[0].nightLight+'%',''],['rest','spark','휴식 배려','누군가 쉬는 동안 다른 가족의 TV 시청과 충돌하지 않게 조절합니다.','TV 변경 전 가족의 활동 확인','amber'],['clean','robot','방해 적은 곳부터 청소','현재 방별 활동을 보고 청소 순서를 다시 정합니다.','잠든 방은 뒤로 미루기','mint'],['arrival','home','귀가 전 환경 준비','예상 귀가 시간대에 설정한 온도로 집을 준비합니다.','자동 실행 전 확인받기','']];return `${statusbar()}${pageHead('자동화','우리 집에 맞는 행동을 선택하세요.','HOME ACTIONS')}<div class="pad"><div class="notice" style="margin-bottom:13px">실제 가전 연결 없이 화면에서 동작을 모사합니다. 각 기능을 켜고 끄거나 행동 기준을 볼 수 있습니다.</div><div class="stack">${cards.map(([id,ic,title,desc,foot,tone])=>`<div class="card routine-card"><div class="routine-head"><span class="routine-ico ${tone}">${icon(ic,'sm')}</span><span class="grow"><strong>${title}</strong><p>${desc}</p></span><button class="toggle ${state.routines[id]?'on':''}" role="switch" aria-checked="${!!state.routines[id]}" aria-label="${title} ${state.routines[id]?'끄기':'켜기'}" data-action="toggle-routine" data-value="${id}"></button></div><div class="routine-foot"><span>${foot}</span><button class="link-btn" data-action="routine-detail" data-value="${id}">자세히</button></div></div>`).join('')}</div></div>${tabs()}`}
    function guidePage(){const items=[['handoff','01','방을 옮겨도 이어서 이해해요','방 1 → 거실 · 사람별 위치 인계'],['conflict','02','가족의 상황이 다를 때','쉬는 사람과 TV 보는 사람 함께 고려'],['privacy','03','카메라를 끄면 어떻게 되나요?','관측 불가를 비어 있음과 구분'],['clean','04','청소는 방해 적은 곳부터','사람과 활동에 맞춰 순서 변경']];return `${statusbar()}${pageHead('사용 가이드','일상의 장면으로 기능을 살펴보세요.','EXPLORE HOMEMESH')}<div class="pad"><div class="card card-pad" style="background:linear-gradient(140deg,#e7efff,#f1f7ff);border:0;margin-bottom:15px"><div class="eyebrow">HOW IT WORKS</div><h2 style="font-size:19px;letter-spacing:-.04em;margin:7px 0">한 방에서 놓쳐도,<br>집 전체는 기억합니다.</h2><p class="small muted" style="margin:0">각 모듈은 자기 공간을 보고, 집은 필요한 결과를 이어 받습니다.</p></div><div class="stack">${items.map(([id,n,title,desc])=>`<button class="guide-card" data-action="guide-detail" data-value="${id}"><span class="guide-num">${n}</span><span class="grow"><strong>${title}</strong><small>${desc}</small></span>${icon('chevron','sm')}</button>`).join('')}</div><div class="section-head"><h2>어디까지 직접 하나요?</h2></div><div class="card card-pad"><div class="reason-step"><b>1</b><div><strong>공간에서 관측</strong><p>각 모듈이 자기 방의 사람과 활동을 확인합니다.</p></div></div><div class="reason-step"><b>2</b><div><strong>집 전체 상태로 연결</strong><p>사람별 위치와 마지막 확인 시각을 함께 유지합니다.</p></div></div><div class="reason-step"><b>3</b><div><strong>상황에 맞게 행동</strong><p>가족의 선호가 충돌하거나 확실하지 않으면 보류합니다.</p></div></div></div></div>${tabs()}`}
    function settingsPage(){return `${statusbar()}${pageHead('환경설정','모듈과 개인정보 설정을 관리합니다.','SETTINGS')}<div class="pad"><div class="section-head"><h2>우리 집 모듈</h2></div><div class="card card-pad">${state.modules.map((m,i)=>`<div class="setting-row"><span class="routine-ico">${icon('camera','sm')}</span><span class="grow"><strong>모듈 ${i+1} · ${esc(state.rooms[m.room])}</strong><small>${m.id} · ${m.on?'정상 작동':'작동 중지'}</small></span><button class="toggle ${m.on?'on':''}" role="switch" aria-checked="${!!m.on}" aria-label="모듈 ${i+1} ${m.on?'끄기':'켜기'}" data-action="toggle-module" data-value="${m.id}"></button></div>`).join('')}</div><div class="section-head"><h2>공간별 프라이버시</h2></div><div class="card card-pad">${roomIds.map(id=>`<div class="setting-row"><span class="routine-ico" style="background:#f1f3f7;color:#69788e">${icon('eyeoff','sm')}</span><span class="grow"><strong>${esc(state.rooms[id])} 카메라 중지</strong><small>${state.privacy[id]?'관측 중지 · 위치 미확인 가능':'이 공간의 카메라 사용 중'}</small></span><button class="toggle ${state.privacy[id]?'on':''}" role="switch" aria-checked="${!!state.privacy[id]}" aria-label="${esc(state.rooms[id])} 프라이버시 모드 ${state.privacy[id]?'끄기':'켜기'}" data-action="toggle-privacy" data-value="${id}"></button></div>`).join('')}</div><div class="section-head"><h2>데모 관리</h2></div><div class="card card-pad"><div class="setting-row"><span class="grow"><strong>처음 설정 다시 보기</strong><small>집·가족 설정 과정을 다시 시작합니다.</small></span><button class="link-btn" data-action="restart">시작</button></div><div class="setting-row"><span class="grow"><strong>예시 장면 초기화</strong><small>집 지도와 실행 기록을 처음 장면으로 돌립니다.</small></span><button class="link-btn" data-action="reset-story">초기화</button></div></div><div class="notice" style="margin:14px 0 0">제품 콘셉트 데모 · 로컬 추론, 외부 기기 연동, 실제 인식 기능은 이 HTML에 포함되지 않습니다.</div></div>${tabs()}`}
    const pageHead=(title,desc,kicker)=>`<div class="page-head"><div class="eyebrow">${kicker}</div><h1>${title}</h1><p>${desc}</p></div>`;
    const tabs=()=>`<nav class="tabbar" aria-label="하단 메뉴">${[['home','home','집'],['people','users','생활 패턴'],['routines','spark','자동화'],['guide','book','가이드'],['settings','settings','설정']].map(([id,ic,label])=>`<button class="tab ${state.tab===id?'active':''}" data-action="tab" data-value="${id}" aria-current="${state.tab===id?'page':'false'}">${icon(ic)}<span>${label}</span></button>`).join('')}</nav>`;
    function render(){const el=$('app');el.innerHTML=state.onboard<7?onboard():({home,people:peoplePage,routines:routinesPage,guide:guidePage,settings:settingsPage}[state.tab]||home)();$('overlay').innerHTML=sheet?renderSheet():'';save()}
    function openSheet(type,value){sheet={type,value};render()}
    function renderSheet(){if(!sheet)return '';const {type,value}=sheet;let title='',sub='',body='';const p=state.people.find(x=>x.id===value)||state.people[0];
      if(type==='room'){const id=value,ppl=livePerson(id),m=state.modules.find(x=>x.room===id),privacy=state.privacy[id];title=state.rooms[id];sub=privacy?'카메라 관측 중지':m?'모듈 연결됨':'연결된 모듈 없음';body=`<div class="pill-row"><span class="pill">${id==='extra'?'센서 없음':id==='kitchen'?'24°C · 52%':id==='living'?'23°C · 48%':'22°C · 46%'}</span><span class="pill">${privacy?'현재 위치 미확인':ppl.length?esc(ppl.map(x=>x.person.name).join(', ')):'현재 사용자 없음'}</span></div><div class="divider"></div><div class="small bold">현재 관측</div><p class="small muted">${privacy?'카메라가 꺼져 있어 현재 위치를 확인할 수 없습니다. 다른 방에서 확인되면 상태가 갱신됩니다.':ppl.length?ppl.map(x=>`${esc(x.person.name)} · ${x.unknown?'마지막 확인 · 현재 미확인':esc(x.label)}`).join('<br>'):'이 방에서 관측된 사람이 없습니다.'}</p><div class="notice ${privacy?'warn':''}">${privacy?'프라이버시 모드에서는 비어 있음으로 단정하지 않습니다.':'가전 상태는 시연용 예시이며 실제 연결되지 않았습니다.'}</div><button class="primary" data-action="toggle-privacy" data-value="${id}">${privacy?'프라이버시 모드 끄기':'프라이버시 모드 켜기'}</button>`}
      else if(type==='why'){title='왜 이렇게 했나요?';sub='현재 장면의 판단 과정';const step=state.scenario;body=`<div class="reason-step"><b>1</b><div><strong>관측</strong><p>${step===4?'거실 카메라가 꺼졌습니다.':step===1?'민호가 방 1 시야에서 사라졌습니다.':step===5?'주방 모듈이 민호를 다시 확인했습니다.':'각 모듈이 가족의 위치와 활동을 확인했습니다.'}</p></div></div><div class="reason-step"><b>2</b><div><strong>상황 연결</strong><p>${step===1?'다른 방에서 확인되기 전까지 이동 중으로 표시합니다.':step===3?'민호는 쉬려 하고, 지수는 TV를 보고 있습니다.':step===4?'마지막 위치는 유지하되 현재 위치로 확정하지 않습니다.':'방별 결과를 가족의 집 전체 상태로 합쳤습니다.'}</p></div></div><div class="reason-step"><b>3</b><div><strong>행동</strong><p>${step===3?'TV 제어는 보류하고 거실 조명만 낮췄습니다.':step===4?'위치가 불확실한 자동 행동은 보류합니다.':step===1?'새 위치가 확인될 때까지 자동 행동을 기다립니다.':'필요한 행동을 제안하거나 집 지도에 반영했습니다.'}</p></div></div><div class="notice">시연용 판단 흐름입니다. 실제 인식·가전 제어는 수행하지 않습니다.</div>`}
      else if(type==='logs'){title='최근 활동';sub='이 앱에서 진행한 시연 기록';body=`<div class="activity-log">${state.logs.length?state.logs.map(x=>`<div class="log-item"><time>${esc(x.time)}</time><strong>${esc(x.title)}</strong><span class="muted">${esc(x.description)}</span></div>`).join(''):'<div class="notice">아직 시연 기록이 없습니다. 집 화면에서 다음 장면을 눌러보세요.</div>'}</div>`}
      else if(type==='person'){title=`${p.name}의 생활 설정`;sub='시간은 대략적인 범위로 지정합니다.';body=`<div class="field"><label>평일 기상 범위</label><div class="range-pair"><input type="time" data-person-pref="wake0" data-person="${p.id}" value="${p.wake[0]}"><span>부터</span><input type="time" data-person-pref="wake1" data-person="${p.id}" value="${p.wake[1]}"></div></div><div class="field"><label>주말 기상 범위</label><div class="range-pair"><input type="time" data-person-pref="weekendWake0" data-person="${p.id}" value="${p.weekendWake[0]}"><span>부터</span><input type="time" data-person-pref="weekendWake1" data-person="${p.id}" value="${p.weekendWake[1]}"></div></div><div class="field"><label>취침 범위</label><div class="range-pair"><input type="time" data-person-pref="sleep0" data-person="${p.id}" value="${p.sleep[0]}"><span>부터</span><input type="time" data-person-pref="sleep1" data-person="${p.id}" value="${p.sleep[1]}"></div></div><div class="field"><label>선호 온도 · ${p.temp}°C</label><input type="range" min="18" max="28" data-person-pref="temp" data-person="${p.id}" value="${p.temp}"></div><div class="field"><label>야간 이동 조명 · ${p.nightLight}%</label><input type="range" min="5" max="50" data-person-pref="nightLight" data-person="${p.id}" value="${p.nightLight}"></div><div class="notice">앱은 지정한 값을 개인 선호로 사용합니다. 가족의 활동과 충돌하면 자동 행동을 보류할 수 있습니다.</div><button class="primary" data-action="close">저장하고 닫기</button>`}
      else if(type==='routine'){const d={night:['밤중 이동 조명','수면 시간대에 방에서 나와 이동할 가능성이 높으면, 통로를 낮은 밝기로 준비합니다.','사용자별 야간 밝기를 따릅니다.'],rest:['휴식 배려','쉬는 사람이 확인되면 조명과 소음이 큰 작업을 조정합니다.','TV를 보는 다른 가족이 있으면 TV 변경을 보류합니다.'],clean:['방해 적은 곳부터 청소','방별 사람과 활동을 보고 청소 순서를 변경합니다.','수면 중인 방과 조리 중인 주방은 뒤로 미룹니다.'],arrival:['귀가 전 환경 준비','예상 귀가 시간대에 환경을 선호 범위로 조정합니다.','예시에서는 실행 전 확인을 요청합니다.']}[value];title=d[0];sub='언제 행동하고, 언제 기다리는지';body=`<div class="reason-step"><b>1</b><div><strong>상황</strong><p>${d[1]}</p></div></div><div class="reason-step"><b>2</b><div><strong>행동 기준</strong><p>${d[2]}</p></div></div><div class="notice">${state.routines[value]?'현재 사용 중입니다.':'현재 꺼져 있습니다.'} 가전 동작은 데모에서 모사합니다.</div><button class="primary" data-action="toggle-routine" data-value="${value}">${state.routines[value]?'기능 끄기':'기능 켜기'}</button>`}
      else if(type==='guide'){const d={handoff:['방을 옮겨도 이어서 이해해요','민호가 방 1을 나가면 잠시 이동 중으로 표시합니다. 거실 모듈이 다시 확인하면 지도에서 위치를 갱신합니다.',2],conflict:['가족의 상황이 다를 때','민호는 쉬려 하지만 지수는 TV를 보고 있습니다. 집은 TV를 마음대로 끄지 않고 조명만 조절합니다.',3],privacy:['카메라를 끄면 어떻게 되나요?','카메라가 꺼진 방은 비어 있다고 단정하지 않습니다. 마지막 관측을 표시하고 다음 관측을 기다립니다.',4],clean:['청소는 방해 적은 곳부터','사람이 쉬거나 집중하는 방은 뒤로 미루고, 덜 방해되는 방부터 청소를 제안합니다.',3]}[value];title=d[0];sub='상황 → 확인 → 행동';body=`<div class="notice">${d[1]}</div><div class="reason-step"><b>1</b><div><strong>관측</strong><p>각 방의 모듈이 자기 공간에서 필요한 상태를 확인합니다.</p></div></div><div class="reason-step"><b>2</b><div><strong>공동 판단</strong><p>집 지도는 방 사이의 정보와 사용자 선호를 연결합니다.</p></div></div><div class="reason-step"><b>3</b><div><strong>사용자 제어</strong><p>앱에서 행동을 보거나 취소하고, 선호를 바꿀 수 있습니다.</p></div></div><button class="primary" data-action="try-guide" data-value="${d[2]}">집 화면에서 예시 체험하기</button>`}
      else{title='상태 표시 안내';sub='집 지도에서 사용하는 세 가지 상태';body=`<div class="reason-step"><b>✓</b><div><strong>확인됨</strong><p>모듈이 지금 이 공간에서 사람을 확인했습니다.</p></div></div><div class="reason-step"><b>↗</b><div><strong>이동 중</strong><p>기존 방에서 사라졌고 다른 공간에서는 아직 확인되지 않았습니다.</p></div></div><div class="reason-step"><b>?</b><div><strong>미확인</strong><p>카메라가 꺼졌거나 관측이 부족합니다. 비어 있음과 다릅니다.</p></div></div>`}
      return `<div class="sheet-wrap" data-action="close-backdrop"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><div class="sheet-handle"></div><div class="sheet-head"><div><h2 id="sheetTitle">${esc(title)}</h2><p>${esc(sub)}</p></div><button class="close" data-action="close" aria-label="닫기">×</button></div><div class="divider"></div>${body}</div></div>`}
    function updatePref(p,key,val){if(['temp','nightLight'].includes(key))p[key]=Number(val);else if(key.startsWith('wake'))p.wake[Number(key.at(-1))]=val;else if(key.startsWith('sleep'))p.sleep[Number(key.at(-1))]=val;else if(key.startsWith('weekendWake'))p.weekendWake[Number(key.at(-1))]=val}
    function handle(action,value){
      if(action==='next'){if(state.onboard===3&&!state.modules.length){say('모듈을 한 개 이상 선택해 주세요.');return}if(state.onboard===4){const unfinished=state.people.filter(p=>!p.face||!p.voice);if(unfinished.length){say(`${unfinished.map(p=>p.name).join(', ')}의 얼굴·목소리 시험을 완료해 주세요.`);return}}state.onboard=Math.min(6,state.onboard+1)}
      else if(action==='back')state.onboard=Math.max(0,state.onboard-1);
      else if(action==='sample'){state=initial();state.people.forEach(p=>{p.face=true;p.voice=true});state.onboard=7;log('예시 집 시작','모든 화면을 자유롭게 체험할 수 있습니다.')}
      else if(action==='finish'){state.onboard=7;state.tab='home';log('집 설정 완료',`${state.modules.length}개 모듈과 ${state.people.length}명 가족이 등록됐습니다.`)}
      else if(action==='scan')state.scan=value;
      else if(action==='pair-module'){const i=state.modules.findIndex(m=>m.id===value);if(i>=0){state.modules.splice(i,1);say('모듈 선택을 해제했어요.')}else{const free=roomIds.find(x=>!state.modules.some(m=>m.room===x))||'extra';state.modules.push({id:value,room:free,on:true});state.modules.sort((a,b)=>a.id.localeCompare(b.id));say('모듈을 연결했어요.')}}
      else if(action==='add-person'){if(state.people.length>=4){say('시연에서는 가족을 최대 4명까지 등록할 수 있어요.');return}const name=prompt('가족의 이름을 입력해 주세요.');if(!name||!name.trim())return;const id=`p${state.people.length+1}`;state.people.push({...structuredClone(defaultPeople[0]),id,name:name.trim().slice(0,12),color:'green',face:false,voice:false});state.enrollPerson=id}
      else if(action==='enroll-person')state.enrollPerson=value;
      else if(action==='enroll-mode')state.enrollMode=value;
      else if(action==='test-enroll'){const p=state.people.find(x=>x.id===state.enrollPerson);p[state.enrollMode]=true;log(`${p.name} ${state.enrollMode==='face'?'얼굴':'목소리'} 시험 완료`,'위치 표시는 시나리오로 모사했습니다.');say(`${p.name}님을 ${state.enrollMode==='face'?'거실':'주방'}에서 확인했어요.`)}
      else if(action==='weekday')state.weekday=value;
      else if(action==='tab'){state.tab=value;sheet=null}
      else if(action==='go-settings'){state.tab='settings';sheet=null}
      else if(action==='scenario-next'){state.scenario=(state.scenario+1)%scenarioSteps.length;if(state.scenario===4)state.privacy.living=true;if(state.scenario===0)state.privacy.living=false;log(scenarioSteps[state.scenario].event,scenarioSteps[state.scenario].detail)}
      else if(action==='room'||action==='person-detail'||action==='routine-detail'||action==='guide-detail')openSheet(({room:'room','person-detail':'person','routine-detail':'routine','guide-detail':'guide'})[action],value);
      else if(action==='why'||action==='logs'||action==='map-info')openSheet(action==='map-info'?'info':action);
      else if(action==='close'){sheet=null}
      else if(action==='close-backdrop'){sheet=null}
      else if(action==='toggle-routine'){state.routines[value]=!state.routines[value];say(state.routines[value]?'기능을 켰어요.':'기능을 껐어요.');sheet=null}
      else if(action==='toggle-module'){const m=state.modules.find(x=>x.id===value);m.on=!m.on;say(m.on?'모듈을 켰어요.':'모듈을 중지했어요.')}
      else if(action==='toggle-privacy'){state.privacy[value]=!state.privacy[value];if(value==='living'&&state.scenario===4&&state.privacy.living===false)state.scenario=5;say(state.privacy[value]?'카메라 관측을 중지했어요.':'카메라 관측을 다시 시작했어요.');sheet=null;log(`${state.rooms[value]} 프라이버시 ${state.privacy[value]?'켜짐':'꺼짐'}`,'카메라 관측 상태를 변경했습니다.')}
      else if(action==='try-guide'){state.tab='home';state.scenario=Number(value);state.privacy.living=state.scenario===4;sheet=null;log('가이드 예시 시작',scenarioSteps[state.scenario].title)}
      else if(action==='reset-story'||action==='undo'){state.scenario=0;state.privacy.living=false;state.logs=[];sheet=null;say('처음 장면으로 돌아왔어요.')}
      else if(action==='restart'){state=initial();sheet=null;say('처음 설정을 다시 시작해요.')}
      render();if(action==='tab'||action==='go-settings'||action==='try-guide')$('app').scrollTop=0;
    }
    document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const act=b.dataset.action;if(act==='close-backdrop'&&e.target!==b)return;handle(act,b.dataset.value)});
    document.addEventListener('change',e=>{const t=e.target;if(t.dataset.field==='homeName')state.homeName=t.value.trim().slice(0,20)||'우리 집';else if(t.dataset.roomName)state.rooms[t.dataset.roomName]=t.value.trim().slice(0,12)||defaultRooms[t.dataset.roomName];else if(t.dataset.module){const m=state.modules.find(x=>x.id===t.dataset.module);if(m)m.room=t.value}else if(t.dataset.pref){const p=state.people.find(x=>x.id===state.enrollPerson);updatePref(p,t.dataset.pref,t.value)}else if(t.dataset.personPref){const p=state.people.find(x=>x.id===t.dataset.person);updatePref(p,t.dataset.personPref,t.value)}else return;render()});
    document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sheet){sheet=null;render()}});
    render();
  })();
  </script>
</body>
</html>
